<div class="row-gallery-wrapper">
    <style>
        /* Scoped styles specifically for this image row layout */
        .image-row-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            box-sizing: border-box;
            padding: 10px 0;
        }

        .gallery-item {
            flex: 1;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
            display: block;
        }

        .gallery-item img:hover {
            transform: scale(1.03);
        }

        /* Lightbox modal styles for ORIGINAL image scale */
        .gallery-lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 99999;
            /* Allows scrolling if the original image size exceeds the screen size */
            overflow: auto; 
            cursor: zoom-out;
        }

        .gallery-lightbox img {
            /* Removes scaling limits to force native pixel dimensions */
            max-width: none !important;
            max-height: none !important;
            width: auto !important;
            height: auto !important;
            
            /* Centers the unscaled image inside the scrolling overlay window */
            display: block;
            margin: auto;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            
            border-radius: 4px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }

        /* Collapse row to single items on small smartphones */
        @media (max-width: 600px) {
            .image-row-container {
                flex-direction: column;
                align-items: center;
            }
            .gallery-item {
                width: 100%;
                max-width: 350px;
            }
        }
    </style>

    <!-- Thumbnail Row -->
    <div class="image-row-container">
        <div class="gallery-item">
            <img src="questo.jpg" alt="Questo" onclick="showPopupGalleryImg(this.src)">
        </div>
        <div class="gallery-item">
            <img src="equesto.jpg" alt="Equesto" onclick="showPopupGalleryImg(this.src)">
        </div>
        <div class="gallery-item">
            <img src="ancora.jpg" alt="Ancora" onclick="showPopupGalleryImg(this.src)">
        </div>
    </div>

    <!-- Overlay Popup Layer -->
    <div id="galleryPopupOverlay" class="gallery-lightbox" onclick="this.style.display='none'">
        <img id="galleryPopupTarget" src="" alt="Enlarged View">
    </div>

    <script>
        function showPopupGalleryImg(sourceUrl) {
            document.getElementById('galleryPopupTarget').src = sourceUrl;
            document.getElementById('galleryPopupOverlay').style.display = 'block'; // Block mode helps absolute position alignment
        }
        
        // Escape key integration to close the popup window seamlessly
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                document.getElementById('galleryPopupOverlay').style.display = 'none';
            }
        });
    </script>
</div>
