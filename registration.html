<div class="row-gallery-wrapper">
    <style>
        /* Scoped styles specifically for this image row layout */
        .image-row-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            box-sizing: border-box;
            padding: 10px 0;
        }

        .gallery-item {
            flex: 1;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
            display: block;
        }

        .gallery-item img:hover {
            transform: scale(1.03);
        }

        /* Lightbox modal overlay background */
        .gallery-lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 99999;
            overflow: auto; 
            box-sizing: border-box;
        }

        /* Base styles for the popup image */
        .gallery-lightbox img {
            display: block;
            margin: auto;
            border-radius: 4px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            transition: max-width 0.2s, max-height 0.2s;
        }

        /* STATE 1: Fits cleanly into the browser viewport */
        .gallery-lightbox img.fit-browser {
            max-width: 90%;
            max-height: 90%;
            width: auto;
            height: auto;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            cursor: zoom-in;
        }

        /* STATE 2: Strict 1:1 original physical dimension layout */
        .gallery-lightbox img.original-size {
            max-width: none !important;
            max-height: none !important;
            width: auto !important;
            height: auto !important;
            position: relative; /* Allows the wrapping container to scroll it naturally */
            margin-top: 5vh;
            margin-bottom: 5vh;
            cursor: zoom-out;
        }

        /* Collapse row to single items on small smartphones */
        @media (max-width: 600px) {
            .image-row-container {
                flex-direction: column;
                align-items: center;
            }
            .gallery-item {
                width: 100%;
                max-width: 350px;
            }
        }
    </style>

    <!-- Thumbnail Row -->
    <div class="image-row-container">
        <div class="gallery-item">
            <img src="questo.jpg" alt="Questo" onclick="showPopupGalleryImg(this.src)">
        </div>
        <div class="gallery-item">
            <img src="equesto.jpg" alt="Equesto" onclick="showPopupGalleryImg(this.src)">
        </div>
        <div class="gallery-item">
            <img src="ancora.jpg" alt="Ancora" onclick="showPopupGalleryImg(this.src)">
        </div>
    </div>

    <!-- Overlay Popup Layer -->
    <div id="galleryPopupOverlay" class="gallery-lightbox" onclick="handleOverlayClick(event)">
        <img id="galleryPopupTarget" class="fit-browser" src="" alt="Enlarged View" onclick="toggleImageSize(event)">
    </div>

    <script>
        const overlay = document.getElementById('galleryPopupOverlay');
        const targetImg = document.getElementById('galleryPopupTarget');

        function showPopupGalleryImg(sourceUrl) {
            targetImg.src = sourceUrl;
            // Always reset to browser-fitting state on initial open
            targetImg.className = 'fit-browser';
            overlay.style.display = 'block';
        }

        function toggleImageSize(event) {
            // Prevent the click on the image from bleeding through and closing the overlay background
            event.stopPropagation(); 
            
            if (targetImg.classList.contains('fit-browser')) {
                targetImg.className = 'original-size';
            } else {
                targetImg.className = 'fit-browser';
                overlay.scrollTo(0, 0); // Reset scroll position when shrinking back
            }
        }

        function handleOverlayClick(event) {
            // Only close if they explicitly clicked the dark background, not the photo
            if (event.target === overlay) {
                closeGallery();
            }
        }

        function closeGallery() {
            overlay.style.display = 'none';
            targetImg.src = '';
        }
        
        // Escape key integration to close the popup window seamlessly
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeGallery();
            }
        });
    </script>
</div>
