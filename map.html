<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Frascati Station to Villa Mondragone</title>
    <!-- Imports MapLibre GL JS engine natively -->
    <script src="https://unpkg.com"></script>
    <link href="https://unpkg.com" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // Exact geographic coordinates [Longitude, Latitude]
        const frascatiStation = [12.6782136, 41.8070027]; 
        const villaMondragone = [12.6962067, 41.8094109];

        // 1. Initialize the Interactive Vector Map
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://openfreemap.org', // High-res free OpenStreetMap style
            center: [12.6872, 41.8082], // Viewport balanced between both locations
            zoom: 14 // Starting zoom depth
        });

        // Add standard navigation zooming controls in top right
        map.addControl(new maplibregl.NavigationControl(), 'top-right');

        // 2. Plot Route Layout Elements on Load
        map.on('load', () => {
            
            // Register line path vector coordinates
            map.addSource('route', {
                'type': 'geojson',
                'data': {
                    'type': 'Feature',
                    'properties': {},
                    'geometry': {
                        'type': 'LineString',
                        'coordinates': [
                            frascatiStation,
                            villaMondragone
                        ]
                    }
                }
            });

            // Render path line overlay style rules
            map.addLayer({
                'id': 'route-line',
                'type': 'line',
                'source': 'route',
                'layout': {
                    'line-join': 'round',
                    'line-cap': 'round'
                },
                'paint': {
                    'line-color': '#ff3366', // Modern hot pink travel path 
                    'line-width': 5
                }
            });

            // 3. Pin UI Map Markers
            // Charcoal gray marker for Frascati Train Station
            new maplibregl.Marker({ color: '#333333' })
                .setLngLat(frascatiStation)
                .addTo(map);

            // Hot pink destination marker for Villa Mondragone
            new maplibregl.Marker({ color: '#ff3366' })
                .setLngLat(villaMondragone)
                .addTo(map);
        });
    </script>

</body>
</html>
